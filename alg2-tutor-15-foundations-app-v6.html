<title>Algebra Foundations</title>
<!-- alg2-tutor-15-foundations-app-v6 (2026-11-16, S12). Changelog v6: teaching features. Every question has three exits: Show me
     how (a twin problem stepped through, then back to his own), a three-level hint ladder, and Skip. Learn tab with a short lesson per
     skill. Find-the-mistake items from his recorded errors. Line-by-line work checking. Skill ladder on the home screen. Assisted
     answers recorded and handled by the adaptive rule. Changelog v5 (2026-11-16, S11): Lesson 10 quadratic formula one step at a time and Lesson
     11 vertex and max/min, first in the plan for the 11-18 test; ten new templates; carries v4 and older progress. Changelog v4 (2026-11-13, S09): merges every earlier store on the device and marks the old
     v2 Lesson 5/6 sessions as legacy so they don't skip the new lessons; plan is Lessons 6-9 (combining held, Lesson 5 dropped from the
     plan); Lesson 6 adds box-corner and two-coefficient items; three new traps. Changelog v3: short lessons (about 10 min) for the Chapter 2 group test
     week: Lesson 5 combine like terms, 6 squares and vertex form, 7 factoring as the box backward, 8 solve by factoring, 9 mixed cold,
     then review. Eight new templates, factored-form check, learner name removed from the results file. Continues from v2 on the
     same device. -->
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2430; --muted:#5b6472; --line:#e3dfd6;
  --accent:#1f5f8b; --accent-ink:#ffffff; --good:#2e7d4f; --warn:#b26a00; --bad:#b3372f;
  --good-bg:#e3f1e8; --warn-bg:#f8ecd9; --bad-bg:#f6e1df;
  --soft:#eef3f7; --mfont:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181e; --card:#1c222b; --ink:#e7eaef; --muted:#9aa4b2; --line:#2c3440;
    --accent:#5aa7dc; --accent-ink:#0e141a; --good:#5cc08a; --warn:#e0a23a; --bad:#ec7a70; --soft:#202a35;
    --good-bg:#1f3328; --warn-bg:#3a2e1a; --bad-bg:#3d2523; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.6rem;margin:.2em 0 .4em}
h2{font-size:1.15rem;margin:1.6em 0 .5em}
p,li{color:var(--ink)}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
.m{font-family:var(--mfont);font-size:1.12em;white-space:nowrap}
.m i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.92em;line-height:1.15}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.sys{margin:.6em 0 .2em 1em;line-height:2}
.hint{color:var(--muted);font-size:.9rem;margin-top:.5em}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar>div{height:100%;background:var(--accent);transition:width .25s}
.prompt{font-size:1.15rem;line-height:1.7;overflow-x:auto}
input[type=text]{width:100%;font:1.25rem var(--mfont);padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:14px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.keys button{font:1.1rem var(--mfont);min-width:48px;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);cursor:pointer;touch-action:manipulation}
.read{min-height:1.6em;margin-top:10px;font-size:.95rem}
.read.ok{color:var(--muted)} .read.err{color:var(--bad)}
.confq{margin:18px 0 8px;font-weight:600}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

button.btn.ghost{background:transparent;color:var(--accent)}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
ul.tight{padding-left:1.2em} ul.tight li{margin:.3em 0}
code,.kbd{font-family:var(--mfont);background:var(--soft);padding:1px 6px;border-radius:5px}
table{width:100%;border-collapse:collapse}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}

.dots .g{background:var(--good)} .dots .w{background:var(--warn)} .dots .b{background:var(--bad)}

.rev{border-left:4px solid var(--line);padding:2px 0 2px 14px;margin:18px 0}
.rev.bad{border-color:var(--bad)} .rev.warn{border-color:var(--warn)}
.rev .lbl{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:8px}
ol.steps{padding-left:1.3em;margin:.4em 0} ol.steps li{margin:.45em 0}
.why{display:block;color:var(--muted);font-size:.88rem}
textarea{width:100%;height:140px;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}
.note{font-size:.9rem;color:var(--muted)}

.pbar>div{height:100%;background:var(--accent)}

<body>
<main id="app"></main>
<script>
/* alg2-tutor-14 Chapter 2 app engine v1 (2026-10-30, S04).
   Core parser and checkers copied verbatim from alg2-tutor-06-engine-v2 (lines 4-486), plus:
   complex solution sets, unions of intervals, multiple choice, vertex-form and exact-form checks,
   and the 12 Chapter 2 templates (completing the square, quadratic formula/discriminant, key features).
   Pure JS, no DOM. Browser: window.ALG2C2. Node: module.exports. */
(function (root) {
  'use strict';

  // ---------- RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed) {
    var r = mulberry32(seed);
    var R = {
      f: r,
      int: function (lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); },
      nz: function (lo, hi) { var v; do { v = lo + Math.floor(r() * (hi - lo + 1)); } while (v === 0); return v; },
      pick: function (arr) { return arr[Math.floor(r() * arr.length)]; },
      shuffle: function (arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
    };
    return R;
  }

  // ---------- number helpers ----------
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; }
  function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }
  function reduce(p, q) { if (q < 0) { p = -p; q = -q; } var g = gcd(p, q) || 1; return [p / g, q / g]; }
  function isSquarefree(n) { if (n < 2) return false; for (var k = 2; k * k <= n; k++) if (n % (k * k) === 0) return false; return true; }
  function simplifySqrt(n) { // returns [outside, inside]
    var out = 1, ins = n;
    for (var k = Math.floor(Math.sqrt(n)); k >= 2; k--) { if (ins % (k * k) === 0) { out *= k; ins /= (k * k); k = Math.floor(Math.sqrt(ins)) + 1; } }
    return [out, ins];
  }
  function approxEq(a, b) { return Math.abs(a - b) <= 1e-7 * Math.max(1, Math.abs(a), Math.abs(b)); }

  // ---------- normalization ----------
  var SUP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-' };
  function normalize(s) {
    s = String(s == null ? '' : s).toLowerCase();
    s = s.replace(/[−–—]/g, '-').replace(/[×·⋅∙]/g, '*').replace(/÷/g, '/');
    s = s.replace(/≤/g, '<=').replace(/≥/g, '>=').replace(/=</g, '<=').replace(/=>/g, '>=');
    s = s.replace(/∞/g, 'inf').replace(/infinity/g, 'inf');
    s = s.replace(/\+\/-|\+-/g, '±');
    // superscripts -> ^(...)
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g, function (m) { var t = ''; for (var i = 0; i < m.length; i++) t += SUP[m[i]]; return '^(' + t + ')'; });
    s = s.replace(/√\s*\(/g, 'sqrt(');
    s = s.replace(/√\s*([0-9.]+|[a-z])/g, 'sqrt($1)');
    s = s.replace(/sqrt\s*(?!\s*\()([0-9.]+|[a-z])/g, 'sqrt($1)');
    s = s.replace(/\s+/g, ' ').trim();
    return s;
  }

  // ---------- tokenizer / parser ----------
  function tokenize(s) {
    var toks = [], i = 0;
    while (i < s.length) {
      var ch = s[i];
      if (ch === ' ') { i++; continue; }
      if (/[0-9.]/.test(ch)) {
        var j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++;
        var str = s.slice(i, j);
        if ((str.match(/\./g) || []).length > 1 || str === '.') throw new Error('“' + str + '” isn’t a number');
        toks.push({ t: 'num', v: parseFloat(str), dec: str.indexOf('.') >= 0 ? str.length - str.indexOf('.') - 1 : 0 }); i = j; continue;
      }
      if (/[a-z]/.test(ch)) {
        if (s.slice(i, i + 4) === 'sqrt') { toks.push({ t: 'fn', v: 'sqrt' }); i += 4; continue; }
        toks.push({ t: 'var', v: ch }); i++; continue;
      }
      if ('+-*/^(),'.indexOf(ch) >= 0) { toks.push({ t: ch }); i++; continue; }
      if (ch === '[' || ch === ']') { toks.push({ t: ch === '[' ? '(' : ')' }); i++; continue; }
      throw new Error('I don’t recognize “' + ch + '”');
    }
    // implicit multiplication
    var out = [];
    for (var k = 0; k < toks.length; k++) {
      var a = out[out.length - 1], b = toks[k];
      if (a && (a.t === 'num' || a.t === 'var' || a.t === ')') && (b.t === 'num' || b.t === 'var' || b.t === 'fn' || b.t === '(')) out.push({ t: '*' });
      out.push(b);
    }
    return out;
  }
  function parse(str) {
    var toks = tokenize(normalize(str));
    if (!toks.length) throw new Error('Nothing typed yet');
    var p = 0;
    function peek() { return toks[p]; }
    function eat(t) { var k = toks[p]; if (!k || k.t !== t) throw new Error('Expected “' + t + '”'); p++; return k; }
    function expr() {
      var n = term();
      while (peek() && (peek().t === '+' || peek().t === '-')) { var op = toks[p++].t; var r = term(); n = { t: op === '+' ? 'add' : 'sub', a: n, b: r }; }
      return n;
    }
    function term() {
      var n = unary();
      while (peek() && (peek().t === '*' || peek().t === '/')) { var op = toks[p++].t; var r = unary(); n = { t: op === '*' ? 'mul' : 'div', a: n, b: r }; }
      return n;
    }
    function unary() {
      if (peek() && peek().t === '-') { p++; return { t: 'neg', a: unary() }; }
      if (peek() && peek().t === '+') { p++; return unary(); }
      return power();
    }
    function power() {
      var base = primary();
      if (peek() && peek().t === '^') { p++; var e = unary(); return { t: 'pow', a: base, b: e }; }
      return base;
    }
    function primary() {
      var k = peek();
      if (!k) throw new Error('The expression ends too early');
      if (k.t === 'num') { p++; var nn = { t: 'num', v: k.v }; if (k.dec) nn.dec = k.dec; return nn; }
      if (k.t === 'var') { p++; return { t: 'var', v: k.v }; }
      if (k.t === 'fn') { p++; eat('('); var a = expr(); eat(')'); return { t: 'sqrt', a: a }; }
      if (k.t === '(') { p++; var e = expr(); eat(')'); return { t: 'paren', a: e }; }
      throw new Error('Unexpected “' + k.t + '”');
    }
    var tree = expr();
    if (p < toks.length) throw new Error('Unexpected “' + toks[p].t + '”');
    return strip(tree);
  }
  function strip(n) { // remove paren nodes
    if (!n) return n;
    if (n.t === 'paren') return strip(n.a);
    var m = { t: n.t }; if ('v' in n) m.v = n.v; if (n.dec) m.dec = n.dec;
    if (n.a) m.a = strip(n.a); if (n.b) m.b = strip(n.b);
    return m;
  }
  function evaluate(n, env) {
    switch (n.t) {
      case 'num': return n.v;
      case 'var': if (!(n.v in env)) return NaN; return env[n.v];
      case 'add': return evaluate(n.a, env) + evaluate(n.b, env);
      case 'sub': return evaluate(n.a, env) - evaluate(n.b, env);
      case 'mul': return evaluate(n.a, env) * evaluate(n.b, env);
      case 'div': return evaluate(n.a, env) / evaluate(n.b, env);
      case 'neg': return -evaluate(n.a, env);
      case 'pow': return Math.pow(evaluate(n.a, env), evaluate(n.b, env));
      case 'sqrt': var v = evaluate(n.a, env); return v < 0 ? NaN : Math.sqrt(v);
    }
    return NaN;
  }
  function varsIn(n, set) {
    set = set || {};
    if (!n) return set;
    if (n.t === 'var') set[n.v] = true;
    varsIn(n.a, set); varsIn(n.b, set);
    return set;
  }
  function hasAddSub(n) { if (!n) return false; if (n.t === 'add' || n.t === 'sub') return true; if (n.t === 'sqrt') return false; return hasAddSub(n.a) || hasAddSub(n.b); }

  // pretty printer (unicode) for the "we read this as" preview
  var PREC = { add: 1, sub: 1, mul: 2, div: 2, neg: 3, pow: 4, num: 5, var: 5, sqrt: 5 };
  var SUPS = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
  function fmtN(v) { var s = (Math.round(v * 1e9) / 1e9).toString(); return s.replace('-', '−'); }
  function pretty(n) {
    function wrap(c, minP) { var s = pretty(c); return PREC[c.t] < minP ? '(' + s + ')' : s; }
    switch (n.t) {
      case 'num': return fmtN(n.v);
      case 'var': return n.v;
      case 'add': return pretty(n.a) + ' + ' + wrap(n.b, 2);
      case 'sub': return pretty(n.a) + ' − ' + wrap(n.b, 2);
      case 'mul':
        var L = wrap(n.a, 2), R = wrap(n.b, 3);
        var juxt = (n.b.t === 'var' || n.b.t === 'sqrt' || (n.b.t === 'pow' && n.b.a.t === 'var') || R[0] === '(') && n.a.t !== 'div';
        return juxt ? L + R : L + '·' + R;
      case 'div': return wrap(n.a, 2) + '/' + wrap(n.b, 3);
      case 'neg': return '−' + wrap(n.a, 3);
      case 'pow':
        var base = n.a.t === 'num' && n.a.v < 0 ? '(' + pretty(n.a) + ')' : wrap(n.a, 5);
        if (n.b.t === 'num' && Number.isInteger(n.b.v) && n.b.v >= 0) return base + String(n.b.v).split('').map(function (d) { return SUPS[d]; }).join('');
        if (n.b.t === 'neg' && n.b.a.t === 'num' && Number.isInteger(n.b.a.v)) return base + '⁻' + String(n.b.a.v).split('').map(function (d) { return SUPS[d]; }).join('');
        return base + '^(' + pretty(n.b) + ')';
      case 'sqrt': var a = pretty(n.a); return (n.a.t === 'num' || n.a.t === 'var') ? '√' + a : '√(' + a + ')';
    }
    return '?';
  }

  // ---------- equivalence ----------
  var SAMPLES = [-2.31, -1.17, 0.73, 1.91, 2.63, 3.37, -0.41, 4.19, 0.29, -3.07];
  function equivExpr(A, B, vars) {
    var good = 0;
    for (var i = 0; i < SAMPLES.length; i++) {
      var env = {};
      for (var j = 0; j < vars.length; j++) env[vars[j]] = SAMPLES[(i + 3 * j) % SAMPLES.length] + 0.13 * j;
      var a = evaluate(A, env), b = evaluate(B, env);
      if (!isFinite(a) || !isFinite(b)) { if (isFinite(a) !== isFinite(b)) return false; continue; }
      if (!approxEq(a, b)) return false;
      good++;
    }
    return good >= 4;
  }

  // ---------- form checks ----------
  function flattenMul(n, out) {
    out = out || [];
    if (n.t === 'mul') { flattenMul(n.a, out); flattenMul(n.b, out); }
    else if (n.t === 'neg') { flattenMul(n.a, out); }
    else out.push(n);
    return out;
  }
  function flattenAdd(n, out) {
    out = out || [];
    if (n.t === 'add' || n.t === 'sub') { flattenAdd(n.a, out); flattenAdd(n.b, out); } else out.push(n);
    return out;
  }
  function isExpanded(n) {
    if (!n) return true;
    if (n.t === 'mul' && (hasAddSub(n.a) || hasAddSub(n.b))) return false;
    if (n.t === 'pow' && hasAddSub(n.a)) return false;
    if (n.t === 'neg' && hasAddSub(n.a)) return false;
    return isExpanded(n.a) && isExpanded(n.b);
  }
  function factoredCount(n) {
    var fs = flattenMul(n), c = 0;
    for (var i = 0; i < fs.length; i++) {
      var f = fs[i]; if (!Object.keys(varsIn(f)).length) continue;
      if (f.t === 'pow' && f.b.t === 'num' && Number.isInteger(f.b.v) && f.b.v >= 2 && hasAddSub(f.a)) c += f.b.v;
      else c += 1;
    }
    return c;
  }

// "Show me how": a twin problem (same kind, new numbers) revealed one step at a time; he finishes the twin's last step, then
// goes back to his own problem. Recorded as assisted, never as a miss.
function showHow(st, it){
  st.help.show++; save();
  var tw = E.generate(it.template_id, newSeed()); twinCur = tw; var n = tw.steps.length, typed = tw.type !== 'choice' && n >= 2, lastShown = typed ? n - 1 : n, shown = 1, done = false, verdictHTML = '';
  function draw(){
    var more = shown < lastShown;
    var html = header('Show me how') + '<div class="card"><p class="note">Here is one just like yours, with different numbers. Tap through it, then go back and do yours.</p><div class="prompt">'+tw.prompt+'</div><ol class="steps">'+
      tw.steps.slice(0, shown).map(function(x){ return '<li>'+x.m+(x.why?'<span class="why">'+x.why+'</span>':'')+'</li>'; }).join('')+'</ol>';
    if(more) html += '<p class="note">Before you tap: what do you think the next line is?</p><div class="row"><button class="btn" id="more">Next step</button></div>';
    else if(typed && !done) html += '<p><b>Your turn:</b> finish this one. What’s the answer?</p><input type="text" id="tw" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Finish the example"><div class="keys" id="twkeys">'+keypadFor(tw)+'</div><div class="read" id="twread"></div><div class="row"><button class="btn" id="twgo">Check</button><button class="btn ghost" id="twshow">Show me the last step</button></div>';
    else html += verdictHTML + '<p><b>Answer:</b> '+tw.keyHTML+'</p><div class="row"><button class="btn" id="back">Back to my problem</button></div>';
    app.innerHTML = html + '</div>';
    var m = document.getElementById('more'); if(m) m.onclick = function(){ shown++; draw(); };
    var go = document.getElementById('twgo');
    if(go){
      var tin = document.getElementById('tw'), tr = document.getElementById('twread');
      document.getElementById('twkeys').addEventListener('click', function(e){ var kb=e.target.closest('button'); if(!kb) return; var k=kb.getAttribute('data-k'); if(k==='√') k='sqrt('; if(k==='²') k='^2';
        var a=tin.selectionStart==null?tin.value.length:tin.selectionStart, z=tin.selectionEnd==null?a:tin.selectionEnd; tin.value=tin.value.slice(0,a)+k+tin.value.slice(z); tin.focus(); try{ tin.setSelectionRange(a+k.length,a+k.length); }catch(_){} tin.dispatchEvent(new Event('input')); });
      tin.addEventListener('input', function(){ var p = E.preview(tw, tin.value); tr.className = 'read ' + (p.ok ? 'ok' : 'err'); tr.innerHTML = p.ok ? 'Reads as: <span class="m">'+esc(p.text)+'</span>' : esc(p.error||''); });
      go.onclick = function(){ var g; try{ g = E.grade(tw, tin.value); }catch(e){ tr.className='read err'; tr.textContent = e.message; return; }
        st.help.twin = g.verdict; save(); done = true; shown = n;
        verdictHTML = '<div class="verdict '+(g.verdict==='correct'?'good':g.verdict==='form'?'warn':'bad')+'">'+(g.verdict==='correct'?'Right. Now do yours the same way.':g.verdict==='form'?'Right value: '+esc(g.formMsg||'finish it')+'.':'Not quite. Look at the last step, then try yours.')+'</div>'; draw(); };
      document.getElementById('twshow').onclick = function(){ st.help.twin = 'shown'; save(); done = true; shown = n; verdictHTML = ''; draw(); };
    }
    var b = document.getElementById('back'); if(b) b.onclick = function(){ itemScreen(st); };
    window.scrollTo(0,0);
  }
  draw();
}
function submit(st, it, raw, conf){
  var C = S.current;
  var rec = { step: C.idx+1, phase: st.phase, template_id: it.template_id, concept: it.concept, role: it.role, params: it.params,
    prompt_text: txt(it.prompt), key_text: txt(it.keyHTML), response_raw: raw, confidence: conf, time_ms: Date.now()-shownAt, graded: true };
  var H = st.help || { show: 0, hints: 0, twin: null }, assisted = H.show > 0 || H.hints > 0;
  if(assisted){ rec.assisted = true; rec.help_show = H.show; rec.hints_used = H.hints; if(H.twin) rec.twin_result = H.twin; }
  if(st.work && st.work.length) rec.work_lines = st.work.map(function(w){ return { text: w.text, ok: w.ok, at_ms: w.at }; });
  if(C.learn) rec.learn = C.learn;
  if(st.fade) rec.fade_steps_hidden = st.fade;
  if(st.asked){ rec.asks_expected = it.asks; rec.asks_chosen = st.asked.chosen; rec.asks_correct = st.asked.correct; }
  var g = null;
  if(conf==='skip'){ rec.verdict='skipped'; rec.error_type='no-attempt'; }
  else {
    try{ g = E.grade(it, raw); }catch(e){ var r=document.getElementById('read'); r.className='read err'; r.textContent=e.message; return; }
    rec.verdict = g.verdict; rec.response_read = g.text;
    if(g.verdict==='form'){ rec.error_type='notation'; rec.form_code=g.formCode; rec.form_issue=g.formMsg; }
    if(g.verdict==='wrong'){ rec.error_type = g.trap ? g.trap.error_type : 'unknown'; rec.trap_code = g.trap ? g.trap.code : null; rec.trap_label = g.trap ? g.trap.label : null; }
  }
  // adaptive bookkeeping (approved rule)
  var cs = S.cs[it.concept], right = rec.verdict==='correct';
  if(st.phase==='indep'){
    if(right && !assisted){ cs.streak++; cs.miss=0; if(cs.streak>=2) cs.worked=false; }
    else if(!right){ cs.miss++; cs.streak=0; if(cs.miss>=2) cs.worked=true; }
  }
  if((!right || assisted) && st.phase!=='extra' && !C.extraFor[it.concept]){
    C.extraFor[it.concept] = true;
    var closeAt = C.steps.findIndex(function(s){ return s.phase==='close'; });
    var at = Math.max(closeAt < 0 ? C.idx+1 : closeAt, C.idx+1);
    var xt = it.template_id===RET[it.concept] ? DRILL[it.concept][0] : RET[it.concept];
    C.steps.splice(at, 0, { kind:'item', phase:'extra', tid: xt });
  }
  C.items.push(rec); save();
  feedback(st, it, rec, g);
}
function feedback(st, it, rec, g){
  var v = rec.verdict, cls = v==='correct' ? 'good' : v==='form' ? 'warn' : 'bad';
  var head = v==='correct' ? (rec.assisted ? 'Right, with help. One more like it is coming so you can do it solo.' : 'Right.') : v==='form' ? 'Right value, wrong form.' : v==='skipped' ? 'Here’s how to start.' : 'Not quite.';
  var parts = '';
  if(v==='wrong' && rec.trap_label) parts += '<p><b>What happened:</b> '+esc(rec.trap_label)+'.</p>';
  if(v==='form') parts += '<p>'+esc(rec.form_issue)+'</p>';
  if(v!=='correct') parts += '<p><b>Answer:</b> '+it.keyHTML+'</p>';
  parts += (v==='correct' ? '<details><summary>See the steps</summary>'+it.solution+'</details>' : '<div class="lbl" style="font-weight:700;margin-top:10px">The steps</div>'+it.solution);
  if(it.desmos && (st.phase==='indep' || st.phase==='close' || st.phase==='extra')) parts += '<p class="note">Check it in Desmos: type <span class="kbd">'+esc(it.desmos)+'</span> and tap the points. <a href="https://www.desmos.com/calculator" target="_blank" rel="noopener">Open Desmos</a></p>';
  app.innerHTML = header(PH[st.phase]) + '<div class="card"><div class="prompt" style="font-size:1rem">'+it.prompt+'</div>'+
    (v!=='skipped' ? '<p class="note">You wrote: <span class="m">'+esc(rec.response_read||rec.response_raw)+'</span>'+(rec.confidence?' · '+esc(rec.confidence):'')+'</p>' : '')+
    '<div class="verdict '+cls+'">'+head+'</div>'+parts+'<div class="row"><button class="btn" id="nx">Next</button></div></div>';
  document.getElementById('nx').onclick = next;
}

var BIG = {
  F0: { q: 'Why is (−2)(−3) positive and not negative? Slide down the table and watch the answers.',
        line: 'Each row down takes away one −3, so the answer goes up by 3, and it keeps going past 0: negative times negative is positive. Two numbers side by side, like (−7)(−2), always mean multiply: 14. Adding is different: with different signs, subtract the sizes and keep the sign of the bigger one, so −6 + 5 = −1.' },
  F1: { q: 'Is 3<i>x</i> + 2<i>x</i><sup>2</sup> the same as 5<i>x</i><sup>3</sup>? Decide, then slide and watch what multiplying does.',
        line: 'x is a length and x² is an area, so 3x + 2x² stays as it is: you can only combine the same kind. Multiplying is different: x · x makes a square, x². And a number in front of parentheses multiplies every piece inside, sign included. A minus in front belongs to the number: in 2(x − 3) − 4(x − 5), the side of the second box is −4.' },
  F2: { q: 'Is (<i>x</i> + 3)<sup>2</sup> equal to <i>x</i><sup>2</sup> + 9? Count the pieces in the box before you decide.',
        line: 'Two binomials multiply into a box of four pieces: every term times every term. (x + a)(x + b) = x² + ax + bx + ab. Squaring means times itself, so (x + a)² has two middle pieces, never just x² + a². Draw the box on paper every time, even when you think you don’t need it. Check any answer by putting x = 2 into both versions.' },
  K: { name: 'Combining like terms', q: 'Is −8<i>x</i> − 5<i>x</i> equal to −3<i>x</i>, 13<i>x</i>, or −13<i>x</i>? Slide the second term and watch.',
       line: 'Like terms are the same kind: x with x, x² with x², numbers with numbers. Combine them exactly like signed numbers: −8x − 5x is −8 − 5 = −13, so −13x. x² and x never combine. Every box answer ends with this step: x² − 8x − 5x + 40 = x² − 13x + 40. An answer with two x-terms isn’t finished.' },
  Q: { name: 'Squaring a binomial', q: 'Is (<i>x</i> − 6)<sup>2</sup> equal to <i>x</i><sup>2</sup> − 6<i>x</i> + 12? Slide and count the pieces.',
       line: 'Squared means times itself, so write (x − 6)² as (x − 6)(x − 6) before anything else, then box it. There are two equal middle pieces: −6x and −6x make −12x. The corner is (−6)(−6) = +36, never 12. Vertex form works the same way: y = (x − 3)² + 5 becomes x² − 6x + 9 + 5 = x² − 6x + 14.' },
  F4: { name: 'The quadratic formula', q: 'How many times does this parabola cross the x-axis? The number <i>b</i><sup>2</sup> − 4<i>ac</i> tells you before you graph. Slide <i>c</i> and watch.',
       line: 'The quadratic formula solves any ax² + bx + c = 0. Do it in four steps on paper, one line each: (1) get 0 on one side and write a, b and c with their signs; (2) find b² − 4ac; (3) positive means two solutions, zero means one, negative means none that are real; (4) x = (−b ± √(b² − 4ac)) / (2a), once with + and once with −. Your calculator is fine for the arithmetic. Check in Desmos: the solutions are where the graph crosses the x-axis.' },
  F5: { name: 'Vertex, maximum and minimum', q: 'Where is the turning point? Slide and watch the vertex move.',
       line: 'The vertex is the turning point. Its x is −b/(2a); put that x back in to get its y. If a is positive the parabola opens up and the vertex is the minimum; if a is negative it opens down and the vertex is the maximum. Read what the question asks: “when” or “at what x” wants the x; “how high”, “maximum value” or “minimum value” wants the y.' },
  F3: { name: 'Factoring', q: 'You know the four pieces of a box: x², 5x, and 6. What are the sides? Slide to try other boxes.',
       line: 'Factoring is the box run backward: you know the pieces and find the sides. The corner number is the two side numbers multiplied; the x-term is the same two numbers added. For x² + 5x + 6: which two numbers multiply to 6 and add to 5? 2 and 3, so (x + 2)(x + 3). To solve x² + 5x + 6 = 0, factor, then set each parentheses to 0: x = −2 or x = −3. Those are where the parabola crosses the x-axis. Check by multiplying back.' }
};

  draw();
}
function svgEl(w,h){ return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:340px;display:block;margin:8px auto">'; }
function vizF0(el){
  el.innerHTML = '<label class="note">times what: <b id="av">1</b></label><input type="range" id="as" min="-3" max="3" step="1" value="1"><div id="pic"></div><p class="m" id="eq" style="text-align:center"></p>';
  function draw(){
    var n=+document.getElementById('as').value, rows='';
    document.getElementById('av').textContent=(n<0?'−'+(-n):n);
    for(var k=3;k>=-3;k--){ var on=(k===n), show=(k>=n); rows+='<tr'+(on?' style="background:var(--soft);font-weight:700"':'')+'><td>'+(k<0?'(−'+(-k)+')':k)+' × (−3)</td><td>'+(show?(k*-3<0?'−'+(3*k):String(-3*k)):'')+'</td></tr>'; }
    document.getElementById('pic').innerHTML='<table class="ptab">'+rows+'</table>';
    document.getElementById('eq').innerHTML=(n<0?'(−'+(-n)+')':n)+' × (−3) = '+(n*-3<0?'−'+(3*n):String(-3*n))+(n<0?' &nbsp;(negative times negative: positive)':n===0?' &nbsp;(keep sliding left)':'');
  }
  document.getElementById('as').oninput=draw; draw();
}
function vizF1(el){
  el.innerHTML = '<label class="note">number in front: <b id="av">3</b></label><input type="range" id="as" min="-5" max="6" step="1" value="3"><div id="pic"></div><p class="m" id="eq" style="text-align:center"></p>';
  function draw(){
    var a=+document.getElementById('as').value; if(a===0) a=1; document.getElementById('av').textContent=a;
    document.getElementById('pic').innerHTML=E.rectSVG(['x','−4'],[String(a)],[[ (a===1?'':a===-1?'−':a)+'x', String(-4*a)]]);
    document.getElementById('eq').innerHTML=a+'(<i>x</i> − 4) = '+(a===1?'':a===-1?'−':a)+'<i>x</i> '+(-4*a<0?'−':'+')+' '+Math.abs(4*a)+(a<0?' &nbsp;(negative times negative: +)':'');
  }
  document.getElementById('as').oninput=draw; draw();
}
function vizF2(el){
  el.innerHTML = '<label class="note">a = <b id="av">3</b></label><input type="range" id="as" min="-6" max="6" step="1" value="3"><label class="note">b = <b id="bv">3</b></label><input type="range" id="bs" min="-6" max="6" step="1" value="3"><div id="pic"></div><p class="m" id="eq" style="text-align:center"></p>';
  function t(v){ return (v<0?'−':'+')+Math.abs(v); }
  function m(v){ return (v===1?'':v===-1?'−':v)+'x'; }
  function draw(){
    var a=+document.getElementById('as').value||1, b=+document.getElementById('bs').value||1;
    document.getElementById('av').textContent=a; document.getElementById('bv').textContent=b;
    document.getElementById('pic').innerHTML=E.rectSVG(['x',t(b)],['x',t(a)],[['x²',m(b)],[m(a),String(a*b)]]);
    var mid=a+b;
    document.getElementById('eq').innerHTML='(<i>x</i> '+t(a).replace(/([+−])/,'$1 ')+')(<i>x</i> '+t(b).replace(/([+−])/,'$1 ')+') = <i>x</i><sup>2</sup>'+(mid===0?'':' '+(mid<0?'−':'+')+' '+(Math.abs(mid)===1?'':Math.abs(mid))+'<i>x</i>')+' '+(a*b<0?'−':'+')+' '+Math.abs(a*b)+(a===b?' &nbsp;(two equal middle pieces)':'');
  }
  document.getElementById('as').oninput=draw; document.getElementById('bs').oninput=draw; draw();
}

// ---------------- worked example ----------------
function worked(st){
  if(!st.seed){ st.seed=newSeed(); save(); }
  var it=E.generate(st.tid, st.seed), shown=1;
  function draw(){
    app.innerHTML = header('Worked example') + '<div class="card"><div class="prompt">'+it.prompt+'</div><ol class="steps">'+
      it.steps.slice(0,shown).map(function(s){ return '<li>'+s.m+(s.why?'<span class="why">'+s.why+'</span>':'')+'</li>'; }).join('')+'</ol>'+
      (shown<it.steps.length ? '<div class="row"><button class="btn" id="more">Next step</button></div>' : '<p><b>Answer:</b> '+it.keyHTML+'</p><div class="row"><button class="btn" id="nx">Now you finish one</button></div>')+'</div>';
    var m=document.getElementById('more'); if(m) m.onclick=function(){ shown++; draw(); };
    var n=document.getElementById('nx'); if(n) n.onclick=next;
  }
  draw();
}
function sentence(st){
  app.innerHTML = header('Last thing') + '<div class="card"><p class="big">In one sentence, in your own words: what is the big idea of <b>'+esc(CNAME[st.c])+'</b>?</p>'+
    '<textarea id="sent" style="height:90px;font:1rem system-ui" aria-label="Your sentence"></textarea><p class="note">Not graded. Saying it yourself is what makes it stick.</p><div class="row"><button class="btn" id="nx">Finish session</button></div></div>';
  document.getElementById('nx').onclick=function(){ S.current.sentence=document.getElementById('sent').value; next(); };
}

// ---------------- finish, progress, export ----------------
function finishSession(){
  var C=S.current; C.finished=new Date().toISOString();
  if(!C.learn) S.missedLast = C.items.filter(function(r){ return r.verdict!=='correct' || r.assisted; }).map(function(r){ return { template_id: r.template_id, concept: r.concept, sure: r.confidence==='sure' }; });
  S.sessions.push(C); S.current=null; save();
  summary(S.sessions.length-1);
}
function stats(items){
  var g=items.filter(function(r){ return r.graded; }), c=g.filter(function(r){ return r.verdict==='correct'; }).length;
  var sure=g.filter(function(r){ return r.confidence==='sure'; }), sr=sure.filter(function(r){ return r.verdict==='correct'; }).length;
  var asks=g.filter(function(r){ return 'asks_correct' in r; }), ac=asks.filter(function(r){ return r.asks_correct; }).length;
  return { n:g.length, correct:c, acc: g.length? c/g.length : null, sure:sure.length, sureRight: sr, sureAcc: sure.length? sr/sure.length : null, asks: asks.length, asksRight: ac };
}
function pct(v){ return v==null ? '–' : Math.round(100*v)+'%'; }
function progressTable(){
  if(!S.sessions.length) return '<p class="note">No finished sessions yet.</p>';
  var rows = S.sessions.map(function(s){
    var cells = ['F0','F1','F2','F3','F4','F5'].map(function(c){ var st=stats(s.items.filter(function(r){ return r.concept===c; })); return '<td>'+(st.n? pct(st.acc)+' <span class="note">('+st.correct+'/'+st.n+')</span>' : '–')+'</td>'; }).join('');
    var all=stats(s.items);
    return '<tr><td>'+(s.learn?esc(sessTitle(s)):(s.lesson>=12?'Review':'Lesson '+s.lesson))+(s.legacy?' (old version)':'')+'<br><span class="note">'+(new Date(s.started)).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})+'</span></td>'+cells+'<td>'+pct(all.sureAcc)+'</td></tr>';
  }).join('');
  return '<div style="overflow-x:auto"><table class="prog"><tr><th>Session</th><th>Signed numbers</th><th>Like terms, distributing</th><th>Multiplying binomials</th><th>Factoring</th><th>Quadratic formula</th><th>Vertex, max/min</th><th>Right when sure</th></tr>'+rows+'</table></div>';
}
function payload(i){
  var s=S.sessions[i];
  return { app: APP_FILE, version: VERSION, engine_version: E.version, learn: S.sessions[i].learn || null, session: s.id, lesson: s.lesson, focus_concept: s.focus,
    started: s.started, finished: s.finished, device: s.device, standalone: s.standalone, resumes: s.resumes, adaptive_rule: RULE,
    totals: stats(s.items), concept_state_after: S.cs, big_idea_sentence: s.sentence, items: s.items,
    history: S.sessions.map(function(x){ return { session:x.id, lesson:x.lesson, started:x.started, focus:x.focus, totals:stats(x.items),
      by_concept: ['F0','F1','F2','F3','F4','F5'].reduce(function(o,c){ o[c]=stats(x.items.filter(function(r){ return r.concept===c; })); return o; },{}) }; }) };
}
function fname(i){ var d=new Date(S.sessions[i].finished||Date.now()); function p(n){return (n<10?'0':'')+n;} return 'alg2-tutor-15-results-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.json'; }
function summary(i){
  var s=S.sessions[i], st=stats(s.items);
  var missed=s.items.filter(function(r){ return r.verdict!=='correct'; });
  app.innerHTML='<h1>Session done.</h1><p>'+st.correct+' of '+st.n+' right'+(st.sure? '; right on '+st.sureRight+' of the '+st.sure+' you were sure about':'')+'.</p>'+
    '<div class="card"><b>Send it</b><p class="note">Download the results file and send it to your dad. It’s what the next session gets built from.</p><div class="row"><button class="btn" id="dl">Download results</button><button class="btn ghost" id="cp">Copy results</button></div><div id="cpbox"></div></div>'+
    (missed.length? '<div class="card"><b>Coming back next time</b><p class="note">These come back in your next warm-up, the ones you were sure about first:</p><ul class="tight">'+missed.map(function(r){ return '<li>'+esc(CNAME[r.concept])+': '+esc(r.trap_label||r.form_issue||(r.verdict==='skipped'?'skipped':'missed'))+'</li>'; }).join('')+'</ul></div>' : '')+
    '<h2>Your progress</h2><div class="card">'+progressTable()+'</div><div class="row"><button class="link" id="home">Back to start</button></div>';
  document.getElementById('dl').onclick=function(){
    try{ var P=payload(i), blob=new Blob([JSON.stringify(P,null,2)],{type:'application/json'}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname(i); document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500); }catch(e){ showCopy(); }
  };
  document.getElementById('cp').onclick=function(){
    var t=JSON.stringify(payload(i));
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ document.getElementById('cpbox').innerHTML='<p class="note">Copied. Paste it into a message to your dad.</p>'; }, showCopy); } else showCopy();
  };
  function showCopy(){ var b=document.getElementById('cpbox'); b.innerHTML='<p class="note">Select all of this, copy it, and paste it into a message:</p><textarea readonly>'+esc(JSON.stringify(payload(i)))+'</textarea>'; b.querySelector('textarea').select(); }
  document.getElementById('home').onclick=home;
  window.scrollTo(0,0);
}

function ladder(){
  var all = []; S.sessions.forEach(function(se){ (se.items||[]).forEach(function(r){ all.push(r); }); });
  function has(c, f){ return all.some(function(r){ return r.concept===c && f(r); }); }
  var rows = ['F0','F1','F2','F3','F4','F5'].map(function(c){
    var r1 = S.cs[c].introduced || has(c, function(){ return true; }),
        r2 = has(c, function(r){ return r.verdict==='correct' && (r.phase==='faded' || r.assisted); }),
        r3 = has(c, function(r){ return r.verdict==='correct' && !r.assisted && (r.phase==='indep' || r.phase==='close' || r.phase==='extra'); }),
        r4 = has(c, function(r){ return r.verdict==='correct' && !r.assisted && r.phase==='warm'; });
    return '<tr><td>'+esc(CNAME[c])+'</td>'+[r1,r2,r3,r4].map(function(on){ return '<td><span class="dot'+(on?' on':'')+'"></span></td>'; }).join('')+'</tr>';
  }).join('');
  return '<div style="overflow-x:auto"><table class="ladder" id="ladder"><tr><th>Skill</th><th>Seen the lesson</th><th>Right with help</th><th>Right on your own</th><th>Right cold, a later day</th></tr>'+rows+'</table></div><p class="note">Every skill starts at the left. Needing the lesson first is the normal first step, not a miss.</p>';
}
// ---------------- home ----------------
function home(){
  var C=S.current, n=lessonNo(), L=LESSONS[n], last=S.sessions[S.sessions.length-1];
  var gap='';
  if(last && last.finished){ var mins=Math.round((Date.now()-new Date(last.finished).getTime())/60000); if(mins < 240) gap = '<p class="note">Your last lesson finished '+mins+' minutes ago. One of these a day: the warm-up checks what stuck after a night’s sleep, which is the part that counts. A Learn lesson any time is fine.</p>'; }
  var doneL = S.sessions.filter(function(x){ return !x.legacy; }).map(function(x){ return x.lesson; });
  var plan = '<div class="card"><b>This stretch</b><ul class="tight">'+PLAN.map(function(k){ return '<li>'+(doneL.indexOf(k)>=0?'✓ ':'')+esc(LESSONS[k].title)+'</li>'; }).join('')+'</ul></div>';
  app.innerHTML='<h1>Algebra foundations</h1><p>Short lessons on the moves everything in Algebra 2 is built on, and that Chapter 2 runs on. About 10 minutes each: a warm-up, the big idea when it’s new, an example, then problems on your own. Or open <b>Learn</b> to see the lesson for any skill first.</p>'+
    '<div class="card"><ul class="tight"><li>New to you? Tap <b>“I haven’t learned this: show me how.”</b> That’s what it’s for, and it doesn’t count against you.</li><li>Stuck partway? Tap for a hint. There are three, each one a bit more.</li><li>On longer problems, tap <b>“Check my work line by line”</b> and type each line: it tells you the first line that goes wrong.</li><li>After each answer, tap how sure you are. Close it any time; it picks up where you left off.</li></ul></div>'+
    plan+'<div class="row">'+(C ? '<button class="btn" id="resume">Resume '+esc(sessTitle(C).split(':')[0])+' ('+(C.idx+1)+' of '+(C.steps.length-1)+')</button>' : '<button class="btn" id="start">Start '+esc(L.title)+'</button><button class="btn ghost" id="learn">Learn: pick a skill</button>')+'</div>'+gap+
    '<h2>Your skills</h2><div class="card">'+ladder()+'</div>'+
    '<h2>Your progress</h2><div class="card">'+progressTable()+'</div>'+
    (S.sessions.length ? '<div class="row"><button class="link" id="last">Last session’s results and download</button></div>' : '')+
    '<details><summary>Typing math</summary><ul class="tight"><li>Exponent: <span class="kbd">x^2</span> or the x² button</li><li>Example: <span class="kbd">3x^2 - 5x + 2</span></li><li>Negative numbers: <span class="kbd">-12</span></li><li>Check “Reads as” under the box before you submit.</li></ul></details>';
  var r=document.getElementById('resume'); if(r) r.onclick=function(){ S.current.resumes++; save(); run(); };
  var s=document.getElementById('start'); if(s) s.onclick=function(){ startSession(n); };
  var l=document.getElementById('last'); if(l) l.onclick=function(){ summary(S.sessions.length-1); };
  var le=document.getElementById('learn'); if(le) le.onclick=learnMenu;
  window.scrollTo(0,0);
}

S = load(); if(!S || S.version!==VERSION || (!S.sessions.length && !S.current)){ S = migrate(); save(); }
['F3','F4','F5'].forEach(function(c){ if(!S.cs[c]) S.cs[c] = {introduced:false, worked:true, streak:0, miss:0}; });
window.APP15 = { current: function(){ return cur; }, twin: function(){ return twinCur; }, state: function(){ return S; } };
home();
})();
</script>
