<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algebra 1 Check-up</title>
<!-- alg2-tutor-06-prereq-diagnostic-app-v2 (2026-10-26, S02).
     v2: readable math in the results file; dossier mastery rule (solid / fragile / gap / untested) with a
     confident-wrong flag; decimal-for-exact radicals classified as notation; touch-sized keypad with
     x, minus and inequality keys for iPad; color-mix fallback; storage key changed so v1 progress can't collide. -->
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2430; --muted:#5b6472; --line:#e3dfd6;
  --accent:#1f5f8b; --accent-ink:#ffffff; --good:#2e7d4f; --warn:#b26a00; --bad:#b3372f;
  --good-bg:#e3f1e8; --warn-bg:#f8ecd9; --bad-bg:#f6e1df;
  --soft:#eef3f7; --mfont:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181e; --card:#1c222b; --ink:#e7eaef; --muted:#9aa4b2; --line:#2c3440;
    --accent:#5aa7dc; --accent-ink:#0e141a; --good:#5cc08a; --warn:#e0a23a; --bad:#ec7a70; --soft:#202a35;
    --good-bg:#1f3328; --warn-bg:#3a2e1a; --bad-bg:#3d2523; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.6rem;margin:.2em 0 .4em}
h2{font-size:1.15rem;margin:1.6em 0 .5em}
p,li{color:var(--ink)}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
.m{font-family:var(--mfont);font-size:1.12em;white-space:nowrap}
.m i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.92em;line-height:1.15}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.sys{margin:.6em 0 .2em 1em;line-height:2}
.hint{color:var(--muted);font-size:.9rem;margin-top:.5em}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar>div{height:100%;background:var(--accent);transition:width .25s}
.prompt{font-size:1.15rem;line-height:1.7;overflow-x:auto}
input[type=text]{width:100%;font:1.25rem var(--mfont);padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:14px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.keys button{font:1.1rem var(--mfont);min-width:48px;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);cursor:pointer;touch-action:manipulation}
.read{min-height:1.6em;margin-top:10px;font-size:.95rem}
.read.ok{color:var(--muted)} .read.err{color:var(--bad)}
.confq{margin:18px 0 8px;font-weight:600}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button.btn{font:600 1rem system-ui,sans-serif;min-height:48px;padding:12px 10px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;touch-action:manipulation}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn:disabled{opacity:.45;cursor:default}
button.link{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.95rem;padding:12px 0;margin-top:6px;min-height:44px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
ul.tight{padding-left:1.2em} ul.tight li{margin:.3em 0}
code,.kbd{font-family:var(--mfont);background:var(--soft);padding:1px 6px;border-radius:5px}
table{width:100%;border-collapse:collapse}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.dots span{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;background:var(--line)}
.dots .g{background:var(--good)} .dots .w{background:var(--warn)} .dots .b{background:var(--bad)}
.tag{font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.tag.solid{background:var(--good-bg);color:var(--good)}
.tag.fragile,.tag.untested{background:var(--warn-bg);color:var(--warn)}
.tag.gap{background:var(--bad-bg);color:var(--bad)}
.flag{display:block;font-size:.78rem;color:var(--bad);font-weight:600;margin-top:3px}
.rev{border-left:4px solid var(--line);padding:2px 0 2px 14px;margin:18px 0}
.rev.bad{border-color:var(--bad)} .rev.warn{border-color:var(--warn)}
.rev .lbl{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:8px}
ol.steps{padding-left:1.3em;margin:.4em 0} ol.steps li{margin:.45em 0}
.why{display:block;color:var(--muted);font-size:.88rem}
textarea{width:100%;height:140px;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}
.note{font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* alg2-tutor diagnostic engine v2: parser, checkers, item templates.
   v2 (2026-10-26, S02): v1 plus a notation catch for decimal answers to exact-radical items.
   Pure JS, no DOM. Works in browser (window.ALG2) and Node (module.exports). */
(function (root) {
  'use strict';

  // ---------- RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed) {
    var r = mulberry32(seed);
    var R = {
      f: r,
      int: function (lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); },
      nz: function (lo, hi) { var v; do { v = lo + Math.floor(r() * (hi - lo + 1)); } while (v === 0); return v; },
      pick: function (arr) { return arr[Math.floor(r() * arr.length)]; },
      shuffle: function (arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
    };
    return R;
  }

  // ---------- number helpers ----------
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; }
  function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }
  function reduce(p, q) { if (q < 0) { p = -p; q = -q; } var g = gcd(p, q) || 1; return [p / g, q / g]; }
  function isSquarefree(n) { if (n < 2) return false; for (var k = 2; k * k <= n; k++) if (n % (k * k) === 0) return false; return true; }
  function simplifySqrt(n) { // returns [outside, inside]
    var out = 1, ins = n;
    for (var k = Math.floor(Math.sqrt(n)); k >= 2; k--) { if (ins % (k * k) === 0) { out *= k; ins /= (k * k); k = Math.floor(Math.sqrt(ins)) + 1; } }
    return [out, ins];
  }
  function approxEq(a, b) { return Math.abs(a - b) <= 1e-7 * Math.max(1, Math.abs(a), Math.abs(b)); }

  // ---------- normalization ----------
  var SUP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-' };
  function normalize(s) {
    s = String(s == null ? '' : s).toLowerCase();
    s = s.replace(/[−–—]/g, '-').replace(/[×·⋅∙]/g, '*').replace(/÷/g, '/');
    s = s.replace(/≤/g, '<=').replace(/≥/g, '>=').replace(/=</g, '<=').replace(/=>/g, '>=');
    s = s.replace(/∞/g, 'inf').replace(/infinity/g, 'inf');
    s = s.replace(/\+\/-|\+-/g, '±');
    // superscripts -> ^(...)
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g, function (m) { var t = ''; for (var i = 0; i < m.length; i++) t += SUP[m[i]]; return '^(' + t + ')'; });
    s = s.replace(/√\s*\(/g, 'sqrt(');
    s = s.replace(/√\s*([0-9.]+|[a-z])/g, 'sqrt($1)');
    s = s.replace(/sqrt\s*(?!\s*\()([0-9.]+|[a-z])/g, 'sqrt($1)');
    s = s.replace(/\s+/g, ' ').trim();
    return s;
  }

  // ---------- tokenizer / parser ----------
  function tokenize(s) {
    var toks = [], i = 0;
    while (i < s.length) {
      var ch = s[i];
      if (ch === ' ') { i++; continue; }
      if (/[0-9.]/.test(ch)) {
        var j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++;
        var str = s.slice(i, j);
        if ((str.match(/\./g) || []).length > 1 || str === '.') throw new Error('“' + str + '” isn’t a number');
        toks.push({ t: 'num', v: parseFloat(str), dec: str.indexOf('.') >= 0 ? str.length - str.indexOf('.') - 1 : 0 }); i = j; continue;
      }
      if (/[a-z]/.test(ch)) {
        if (s.slice(i, i + 4) === 'sqrt') { toks.push({ t: 'fn', v: 'sqrt' }); i += 4; continue; }
        toks.push({ t: 'var', v: ch }); i++; continue;
      }
      if ('+-*/^(),'.indexOf(ch) >= 0) { toks.push({ t: ch }); i++; continue; }
      if (ch === '[' || ch === ']') { toks.push({ t: ch === '[' ? '(' : ')' }); i++; continue; }
      throw new Error('I don’t recognize “' + ch + '”');
    }
    // implicit multiplication
    var out = [];
    for (var k = 0; k < toks.length; k++) {
      var a = out[out.length - 1], b = toks[k];
      if (a && (a.t === 'num' || a.t === 'var' || a.t === ')') && (b.t === 'num' || b.t === 'var' || b.t === 'fn' || b.t === '(')) out.push({ t: '*' });
      out.push(b);
    }
    return out;
  }
  function parse(str) {
    var toks = tokenize(normalize(str));
    if (!toks.length) throw new Error('Nothing typed yet');
    var p = 0;
    function peek() { return toks[p]; }
    function eat(t) { var k = toks[p]; if (!k || k.t !== t) throw new Error('Expected “' + t + '”'); p++; return k; }
    function expr() {
      var n = term();
      while (peek() && (peek().t === '+' || peek().t === '-')) { var op = toks[p++].t; var r = term(); n = { t: op === '+' ? 'add' : 'sub', a: n, b: r }; }
      return n;
    }
    function term() {
      var n = unary();
      while (peek() && (peek().t === '*' || peek().t === '/')) { var op = toks[p++].t; var r = unary(); n = { t: op === '*' ? 'mul' : 'div', a: n, b: r }; }
      return n;
    }
    function unary() {
      if (peek() && peek().t === '-') { p++; return { t: 'neg', a: unary() }; }
      if (peek() && peek().t === '+') { p++; return unary(); }
      return power();
    }
    function power() {
      var base = primary();
      if (peek() && peek().t === '^') { p++; var e = unary(); return { t: 'pow', a: base, b: e }; }
      return base;
    }

      if (!k) throw new Error('The expression ends too early');

      if (k.t === 'var') { p++; return { t: 'var', v: k.v }; }
      if (k.t === 'fn') { p++; eat('('); var a = expr(); eat(')'); return { t: 'sqrt', a: a }; }
      if (k.t === '(') { p++; var e = expr(); eat(')'); return { t: 'paren', a: e }; }

    return strip(tree);
  }
  function strip(n) { // remove paren nodes
    if (!n) return n;
    if (n.t === 'paren') return strip(n.a);
    var m = { t: n.t }; if ('v' in n) m.v = n.v; if (n.dec) m.dec = n.dec;
    if (n.a) m.a = strip(n.a); if (n.b) m.b = strip(n.b);

  }
  function evaluate(n, env) {
    switch (n.t) {
      case 'num': return n.v;
      case 'var': if (!(n.v in env)) return NaN; return env[n.v];
      case 'add': return evaluate(n.a, env) + evaluate(n.b, env);
      case 'sub': return evaluate(n.a, env) - evaluate(n.b, env);
      case 'mul': return evaluate(n.a, env) * evaluate(n.b, env);
      case 'div': return evaluate(n.a, env) / evaluate(n.b, env);
      case 'neg': return -evaluate(n.a, env);
      case 'pow': return Math.pow(evaluate(n.a, env), evaluate(n.b, env));
      case 'sqrt': var v = evaluate(n.a, env); return v < 0 ? NaN : Math.sqrt(v);
    }
    return NaN;
  }
  function varsIn(n, set) {
    set = set || {};
    if (!n) return set;
    if (n.t === 'var') set[n.v] = true;
    varsIn(n.a, set); varsIn(n.b, set);
    return set;
  }
  function hasAddSub(n) { if (!n) return false; if (n.t === 'add' || n.t === 'sub') return true; if (n.t === 'sqrt') return false; return hasAddSub(n.a) || hasAddSub(n.b); }

  // pretty printer (unicode) for the "we read this as" preview
  var PREC = { add: 1, sub: 1, mul: 2, div: 2, neg: 3, pow: 4, num: 5, var: 5, sqrt: 5 };
  var SUPS = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };

      case 'add': return pretty(n.a) + ' + ' + wrap(n.b, 2);
      case 'sub': return pretty(n.a) + ' − ' + wrap(n.b, 2);

    }

  }

  // ---------- equivalence ----------
  var SAMPLES = [-2.31, -1.17, 0.73, 1.91, 2.63, 3.37, -0.41, 4.19, 0.29, -3.07];

      var env = {};

  function flattenMul(n, out) {
    out = out || [];

    else if (n.t === 'neg') { flattenMul(n.a, out); }
    else out.push(n);
    return out;
  }
  function flattenAdd(n, out) {
    out = out || [];
    if (n.t === 'add' || n.t === 'sub') { flattenAdd(n.a, out); flattenAdd(n.b, out); } else out.push(n);
    return out;
  }
  function isExpanded(n) {
    if (!n) return true;
    if (n.t === 'mul' && (hasAddSub(n.a) || hasAddSub(n.b))) return false;

  function radicalsSimplified(n) {

  function containsSqrt(n) { if (!n) return false; if (n.t === 'sqrt') return true; return containsSqrt(n.a) || containsSqrt(n.b); }
  function isLowestFraction(n) {
    var m = n.t === 'neg' ? n.a : n;
    if (m.t === 'num') return Number.isInteger(m.v);
    if (m.t === 'div' && m.a.t === 'num' && m.b.t === 'num' && Number.isInteger(m.a.v) && Number.isInteger(m.b.v)) return gcd(m.a.v, m.b.v) === 1 && m.b.v !== 1;
    return false;
  }
  // v2: a bare decimal (e.g. 8.485 for 6√2) on an exact-radical item. Notation, not a wrong idea.
  function isDecimalApprox(item, r) {
    if (item.form !== 'radical' || item.type !== 'number') return false;
    var m = r.ast.t === 'neg' ? r.ast.a : r.ast;

  }

  // ---------- answer parsing by type ----------
  function stripLead(s, names) {
    s = normalize(s);
    for (var i = 0; i < names.length; i++) {
      var re = new RegExp('^\\s*' + names[i] + '\\s*=\\s*');
      if (re.test(s)) return s.replace(re, '');
    }
    return s;
  }
  function expandPM(s) {
    var i = s.indexOf('±');
    if (i < 0) return [s];
    return [s.slice(0, i) + '+' + s.slice(i + 1), s.slice(0, i) + '-' + s.slice(i + 1)];
  }
  function parseNumber(raw) {
    var s = stripLead(raw, ['x', 'y', 'a', 't']);
    var ast = parse(s);
    var vs = Object.keys(varsIn(ast));
    if (vs.length) throw new Error('This answer should be a number, without “' + vs[0] + '”');
    var v = evaluate(ast, {});
    if (!isFinite(v)) throw new Error('That doesn’t evaluate to a real number');
    return { ast: ast, value: v, text: pretty(ast) };
  }
  function parseExprAns(raw, vars) {
    var s = stripLead(raw, ['y']).replace(/^\s*[a-z]\s*\([^=]*\)\s*=\s*/, '');
    var ast = parse(s);
    var vs = Object.keys(varsIn(ast));
    for (var i = 0; i < vs.length; i++) if (vars.indexOf(vs[i]) < 0) throw new Error('Unexpected letter “' + vs[i] + '”; use ' + vars.join(', '));
    return { ast: ast, text: pretty(ast) };
  }
  function parseSet(raw) {
    var s = normalize(raw).replace(/\bor\b|\band\b|;/g, ',');
    var parts = s.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    if (!parts.length) throw new Error('Nothing typed yet');
    var vals = [], texts = [];
    parts.forEach(function (pt) {
      expandPM(pt.replace(/^x\s*=\s*/, '')).forEach(function (q) {
        var r = parseNumber(q); vals.push(r.value); texts.push(r.text);

  // P-01

  function refresh(){
    var p=E.preview(it, inp.value);
    if(p.ok){ read.className='read ok'; read.innerHTML='Reads as: <span class="m">'+esc(p.text)+'</span>'; }
    else { read.className='read err'; read.textContent=p.error||''; }
    btns.forEach(function(b){ b.disabled=!p.ok; });
  }
  inp.addEventListener('input', refresh);
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); if(!btns[0].disabled){ read.className='read ok'; read.innerHTML += ' &nbsp;<b>Now tap how sure you are.</b>'; } } });
  document.getElementById('keys').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    var k=b.getAttribute('data-k'), s=inp.selectionStart==null?inp.value.length:inp.selectionStart, t=inp.selectionEnd==null?s:inp.selectionEnd;
    if(k==='√') k='sqrt(';
    inp.value=inp.value.slice(0,s)+k+inp.value.slice(t);
    var pos=s+k.length; inp.focus(); try{ inp.setSelectionRange(pos,pos); }catch(_){}
    refresh();
  });
  btns.forEach(function(b){ b.onclick=function(){ submit(it, inp.value, b.getAttribute('data-c')); }; });
  document.getElementById('skip').onclick=function(){ submit(it, '', 'skip'); };
  shownAt=Date.now();
  inp.focus();
}

function submit(it, raw, conf){
  var rec = { n: state.idx+1, template_id: it.template_id, skill: it.skill, difficulty: it.difficulty, standards: it.standards,
    params: it.params, prompt_text: txt(it.prompt), key_text: txt(it.keyHTML), response_raw: raw, confidence: conf,
    time_ms: Date.now()-shownAt, skipped: conf==='skip' };
  if(conf==='skip'){ rec.verdict='skipped'; rec.error_type='no-attempt'; }
  else {
    try{
      var g=E.grade(it, raw);
      rec.verdict=g.verdict; rec.response_read=g.text;
      if(g.verdict==='form'){ rec.error_type='notation'; rec.form_issue=g.formMsg; rec.form_code=g.formCode; }
      if(g.verdict==='wrong'){ rec.error_type = g.trap ? g.trap.error_type : 'unknown'; rec.trap_code = g.trap ? g.trap.code : null; rec.trap_label = g.trap ? g.trap.label : null; }
    }catch(e){ var r=document.getElementById('read'); r.className='read err'; r.textContent=e.message; return; }
  }
  state.responses[state.idx]=rec; state.idx++; save(); question();
}

function finish(){ state.finished=new Date().toISOString(); save(); results(); }

function skillSummary(){
  return E.SKILLS.map(function(s){
    var rs=state.responses.filter(function(r){ return r && r.skill===s.id; });
    var count=function(f){ return rs.filter(f).length; };
    var correct=count(function(r){ return r.verdict==='correct'; });
    var form=count(function(r){ return r.verdict==='form'; });
    var wrong=count(function(r){ return r.verdict==='wrong'; });
    var skipped=count(function(r){ return r.verdict==='skipped'; });
    var sureRight=count(function(r){ return r.verdict==='correct' && r.confidence==='sure'; });
    var guessedRight=count(function(r){ return r.verdict==='correct' && r.confidence==='guess'; });
    var confWrong=count(function(r){ return r.verdict==='wrong' && r.confidence==='sure'; });
    var status;
    if(rs.length===0) status='untested';
    else if(wrong+skipped>=2) status='gap';
    else if(correct===rs.length && guessedRight===0 && sureRight>=2) status='solid';
    else status='fragile';
    return { skill:s.id, name:s.name, items:rs.length, correct:correct, form_issues:form, wrong:wrong, skipped:skipped,
      sure_correct:sureRight, guessed_correct:guessedRight, confident_wrong:confWrong, status:status, flagged: confWrong>0,
      dots: rs.map(function(r){ return r.verdict==='correct' ? (r.confidence==='guess'?'w':'g') : (r.verdict==='form'?'w':'b'); }) };
  });
}

function payload(){
  var S=skillSummary();
  var cnt=function(v){ return state.responses.filter(function(r){ return r && r.verdict===v; }).length; };
  return { instrument: INSTRUMENT, version: VERSION, app_file: APP_FILE, engine_version: E.version, learner: 'Charlie',
    seed: state.seed, started: state.started, finished: state.finished, device: navigator.userAgent, status_rule: STATUS_RULE,
    totals: { items: state.responses.length, correct: cnt('correct'), form: cnt('form'), wrong: cnt('wrong'), skipped: cnt('skipped'),
      minutes: Math.round(state.responses.reduce(function(a,r){return a+((r&&r.time_ms)||0);},0)/60000) },
    flagged_skills: S.filter(function(s){ return s.flagged; }).map(function(s){ return s.skill; }),
    skills: S.map(function(s){ var o={}; for(var k in s) if(k!=='dots') o[k]=s[k]; return o; }),
    items: state.responses };
}
function fname(){ var d=new Date(state.finished||Date.now()); function p(n){return (n<10?'0':'')+n;} return 'alg2-tutor-diagnostic-results-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.json'; }

function results(){
  var S=skillSummary(), P=payload(), t=P.totals;
  var LBL={solid:'Solid',fragile:'Fragile',gap:'Needs work',untested:'Untested'};
  var rows=S.map(function(s){ return '<tr><td>'+esc(s.name)+(s.flagged?'<span class="flag">You were sure on one you missed: look at it first</span>':'')+'</td><td class="dots">'+s.dots.map(function(d){return '<span class="'+d+'"></span>';}).join('')+'</td><td><span class="tag '+s.status+'">'+LBL[s.status]+'</span></td></tr>'; }).join('');
  var review='';
  items.forEach(function(it,i){
    var r=state.responses[i]; if(!r) return;
    var guessedRight = r.verdict==='correct' && r.confidence==='guess';
    if(r.verdict==='correct' && !guessedRight) return;
    var cls = (r.verdict==='form'||guessedRight) ? 'warn' : 'bad';
    var head = r.verdict==='skipped' ? 'Skipped' : r.verdict==='form' ? 'Right value, wrong form' : guessedRight ? 'Right, but you were guessing' : (r.confidence==='sure' ? 'Not quite, and you were sure' : 'Not quite');
    review += '<div class="rev '+cls+'"><div><b>'+(i+1)+'. '+head+'</b></div>'+
      '<div class="prompt" style="font-size:1rem">'+it.prompt.replace(/<div class="hint">[\s\S]*?<\/div>/g,'')+'</div>'+
      (r.verdict!=='skipped' ? '<div class="lbl">You wrote</div><div class="m">'+esc(r.response_read||r.response_raw)+'</div>' : '')+
      (r.form_issue ? '<div class="note">'+esc(r.form_issue)+'</div>' : '')+
      (r.trap_label ? '<div class="note">Looks like: '+esc(r.trap_label)+'.</div>' : '')+
      '<div class="lbl">Answer</div><div>'+it.keyHTML+'</div>'+
      '<div class="lbl">How it works</div>'+it.solution+'</div>';
  });
  app.innerHTML =
    '<h1>Done.</h1>'+
    '<p>'+t.correct+' of '+t.items+' right'+(t.skipped? ', '+t.skipped+' skipped':'')+'. About '+t.minutes+' minutes.</p>'+
    '<div class="card"><b>Send your results</b><p class="note">This file is what the tutor gets built from. Download it and send it to your dad, along with a photo of your scratch paper.</p>'+
      '<div class="row"><button class="btn" id="dl">Download results</button><button class="btn ghost" id="cp">Copy results</button></div>'+
      '<div id="cpbox"></div></div>'+
    '<h2>By skill</h2><div class="card"><table>'+rows+'</table>'+
      '<p class="note">Green: right. Amber: right but guessing, or right value in the wrong form. Red: wrong or skipped. Solid means all three right and you were sure on at least two.</p></div>'+
    (review ? '<h2>Go through these</h2><p class="muted">Each one shows the method step by step. Work each one again on paper before reading the steps.</p>'+review : '<h2>Clean sweep</h2><p>Nothing to review. Algebra 1 is solid.</p>')+
    '<div class="row"><button class="link" id="home">Back to start</button></div>';
  document.getElementById('dl').onclick=function(){
    try{
      var blob=new Blob([JSON.stringify(P,null,2)],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname(); document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }catch(e){ showCopy(); }
  };
  document.getElementById('cp').onclick=function(){
    var s=JSON.stringify(P);
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(s).then(function(){ document.getElementById('cpbox').innerHTML='<p class="note">Copied. Paste it into a message to your dad.</p>'; }, showCopy); }
    else showCopy();
  };
  function showCopy(){ var b=document.getElementById('cpbox'); b.innerHTML='<p class="note">Select all of this, copy it, and paste it into a message:</p><textarea readonly>'+esc(JSON.stringify(P))+'</textarea>'; b.querySelector('textarea').select(); }
  document.getElementById('home').onclick=intro;
  window.scrollTo(0,0);
}

intro();
})();
</script>
</body>
</html>
