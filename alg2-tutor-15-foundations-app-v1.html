<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Algebra Foundations</title>
<!-- alg2-tutor-15-foundations-app-v1 (2026-11-01, S05). Algebra 1 foundations: Lesson 1 (like terms, multiplying x's,
     distributing) and Lesson 2 (multiplying binomials with the area box), then mixed review. Built after the 2026-11-01 diagnostic. -->
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2430; --muted:#5b6472; --line:#e3dfd6;
  --accent:#1f5f8b; --accent-ink:#ffffff; --good:#2e7d4f; --warn:#b26a00; --bad:#b3372f;
  --good-bg:#e3f1e8; --warn-bg:#f8ecd9; --bad-bg:#f6e1df;
  --soft:#eef3f7; --mfont:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181e; --card:#1c222b; --ink:#e7eaef; --muted:#9aa4b2; --line:#2c3440;
    --accent:#5aa7dc; --accent-ink:#0e141a; --good:#5cc08a; --warn:#e0a23a; --bad:#ec7a70; --soft:#202a35;
    --good-bg:#1f3328; --warn-bg:#3a2e1a; --bad-bg:#3d2523; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.6rem;margin:.2em 0 .4em}
h2{font-size:1.15rem;margin:1.6em 0 .5em}
p,li{color:var(--ink)}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}
.m{font-family:var(--mfont);font-size:1.12em;white-space:nowrap}
.m i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:.92em;line-height:1.15}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.sys{margin:.6em 0 .2em 1em;line-height:2}
.hint{color:var(--muted);font-size:.9rem;margin-top:.5em}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar>div{height:100%;background:var(--accent);transition:width .25s}
.prompt{font-size:1.15rem;line-height:1.7;overflow-x:auto}
input[type=text]{width:100%;font:1.25rem var(--mfont);padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:14px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.keys{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.keys button{font:1.1rem var(--mfont);min-width:48px;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);cursor:pointer;touch-action:manipulation}
.read{min-height:1.6em;margin-top:10px;font-size:.95rem}
.read.ok{color:var(--muted)} .read.err{color:var(--bad)}
.confq{margin:18px 0 8px;font-weight:600}
.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button.btn{font:600 1rem system-ui,sans-serif;min-height:48px;padding:12px 10px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;touch-action:manipulation}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn:disabled{opacity:.45;cursor:default}
button.link{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.95rem;padding:12px 0;margin-top:6px;min-height:44px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
ul.tight{padding-left:1.2em} ul.tight li{margin:.3em 0}
code,.kbd{font-family:var(--mfont);background:var(--soft);padding:1px 6px;border-radius:5px}
table{width:100%;border-collapse:collapse}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.dots span{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;background:var(--line)}
.dots .g{background:var(--good)} .dots .w{background:var(--warn)} .dots .b{background:var(--bad)}
.tag{font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.tag.solid{background:var(--good-bg);color:var(--good)}
.tag.fragile,.tag.untested{background:var(--warn-bg);color:var(--warn)}
.tag.gap{background:var(--bad-bg);color:var(--bad)}
.flag{display:block;font-size:.78rem;color:var(--bad);font-weight:600;margin-top:3px}
.rev{border-left:4px solid var(--line);padding:2px 0 2px 14px;margin:18px 0}
.rev.bad{border-color:var(--bad)} .rev.warn{border-color:var(--warn)}
.rev .lbl{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:8px}
ol.steps{padding-left:1.3em;margin:.4em 0} ol.steps li{margin:.45em 0}
.why{display:block;color:var(--muted);font-size:.88rem}
textarea{width:100%;height:140px;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}
.note{font-size:.9rem;color:var(--muted)}
</style>
<style>
.phase{font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.opts{display:grid;gap:8px;margin-top:12px}
.opts button{font:1rem system-ui,sans-serif;text-align:left;min-height:48px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);cursor:pointer;touch-action:manipulation}
.opts button.sel{border-color:var(--accent);background:var(--card)}
.opts button.right{border-color:var(--good);background:var(--good-bg)}
.opts button.wrongc{border-color:var(--bad);background:var(--bad-bg)}
.verdict{font-size:1.2rem;font-weight:700;margin:.2em 0 .4em}
.verdict.good{color:var(--good)} .verdict.warn{color:var(--warn)} .verdict.bad{color:var(--bad)}
input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
.calc{font-size:.85rem;color:var(--muted)}
.fade li.hidden{color:var(--muted);list-style:'… '}
.big{font-size:1.05rem}
.prog td,.prog th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.95rem}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.pbar>div{height:100%;background:var(--accent)}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* alg2-tutor-14 Chapter 2 app engine v1 (2026-10-30, S04).
   Core parser and checkers copied verbatim from alg2-tutor-06-engine-v2 (lines 4-486), plus:
   complex solution sets, unions of intervals, multiple choice, vertex-form and exact-form checks,
   and the 12 Chapter 2 templates (completing the square, quadratic formula/discriminant, key features).
   Pure JS, no DOM. Browser: window.ALG2C2. Node: module.exports. */
(function (root) {
  'use strict';

  // ---------- RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed) {
    var r = mulberry32(seed);
    var R = {
      f: r,
      int: function (lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); },
      nz: function (lo, hi) { var v; do { v = lo + Math.floor(r() * (hi - lo + 1)); } while (v === 0); return v; },
      pick: function (arr) { return arr[Math.floor(r() * arr.length)]; },
      shuffle: function (arr) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
    };
    return R;
  }

  // ---------- number helpers ----------
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; }
  function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }
  function reduce(p, q) { if (q < 0) { p = -p; q = -q; } var g = gcd(p, q) || 1; return [p / g, q / g]; }
  function isSquarefree(n) { if (n < 2) return false; for (var k = 2; k * k <= n; k++) if (n % (k * k) === 0) return false; return true; }
  function simplifySqrt(n) { // returns [outside, inside]
    var out = 1, ins = n;
    for (var k = Math.floor(Math.sqrt(n)); k >= 2; k--) { if (ins % (k * k) === 0) { out *= k; ins /= (k * k); k = Math.floor(Math.sqrt(ins)) + 1; } }
    return [out, ins];
  }
  function approxEq(a, b) { return Math.abs(a - b) <= 1e-7 * Math.max(1, Math.abs(a), Math.abs(b)); }

  // ---------- normalization ----------
  var SUP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '-' };
  function normalize(s) {
    s = String(s == null ? '' : s).toLowerCase();
    s = s.replace(/[−–—]/g, '-').replace(/[×·⋅∙]/g, '*').replace(/÷/g, '/');
    s = s.replace(/≤/g, '<=').replace(/≥/g, '>=').replace(/=</g, '<=').replace(/=>/g, '>=');
    s = s.replace(/∞/g, 'inf').replace(/infinity/g, 'inf');
    s = s.replace(/\+\/-|\+-/g, '±');
    // superscripts -> ^(...)
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g, function (m) { var t = ''; for (var i = 0; i < m.length; i++) t += SUP[m[i]]; return '^(' + t + ')'; });
    s = s.replace(/√\s*\(/g, 'sqrt(');
    s = s.replace(/√\s*([0-9.]+|[a-z])/g, 'sqrt($1)');
    s = s.replace(/sqrt\s*(?!\s*\()([0-9.]+|[a-z])/g, 'sqrt($1)');
    s = s.replace(/\s+/g, ' ').trim();
    return s;
  }

  // ---------- tokenizer / parser ----------
  function tokenize(s) {
    var toks = [], i = 0;
    while (i < s.length) {
      var ch = s[i];
      if (ch === ' ') { i++; continue; }
      if (/[0-9.]/.test(ch)) {
        var j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++;
        var str = s.slice(i, j);
        if ((str.match(/\./g) || []).length > 1 || str === '.') throw new Error('“' + str + '” isn’t a number');
        toks.push({ t: 'num', v: parseFloat(str), dec: str.indexOf('.') >= 0 ? str.length - str.indexOf('.') - 1 : 0 }); i = j; continue;
      }
      if (/[a-z]/.test(ch)) {
        if (s.slice(i, i + 4) === 'sqrt') { toks.push({ t: 'fn', v: 'sqrt' }); i += 4; continue; }
        toks.push({ t: 'var', v: ch }); i++; continue;
      }
      if ('+-*/^(),'.indexOf(ch) >= 0) { toks.push({ t: ch }); i++; continue; }
      if (ch === '[' || ch === ']') { toks.push({ t: ch === '[' ? '(' : ')' }); i++; continue; }
      throw new Error('I don’t recognize “' + ch + '”');
    }
    // implicit multiplication
    var out = [];
    for (var k = 0; k < toks.length; k++) {
      var a = out[out.length - 1], b = toks[k];
      if (a && (a.t === 'num' || a.t === 'var' || a.t === ')') && (b.t === 'num' || b.t === 'var' || b.t === 'fn' || b.t === '(')) out.push({ t: '*' });
      out.push(b);
    }
    return out;
  }
  function parse(str) {
    var toks = tokenize(normalize(str));
    if (!toks.length) throw new Error('Nothing typed yet');
    var p = 0;
    function peek() { return toks[p]; }
    function eat(t) { var k = toks[p]; if (!k || k.t !== t) throw new Error('Expected “' + t + '”'); p++; return k; }
    function expr() {
      var n = term();
      while (peek() && (peek().t === '+' || peek().t === '-')) { var op = toks[p++].t; var r = term(); n = { t: op === '+' ? 'add' : 'sub', a: n, b: r }; }
      return n;
    }
    function term() {
      var n = unary();
      while (peek() && (peek().t === '*' || peek().t === '/')) { var op = toks[p++].t; var r = unary(); n = { t: op === '*' ? 'mul' : 'div', a: n, b: r }; }
      return n;
    }
    function unary() {
      if (peek() && peek().t === '-') { p++; return { t: 'neg', a: unary() }; }
      if (peek() && peek().t === '+') { p++; return unary(); }
      return power();
    }
    function power() {
      var base = primary();
      if (peek() && peek().t === '^') { p++; var e = unary(); return { t: 'pow', a: base, b: e }; }
      return base;
    }
    function primary() {
      var k = peek();
      if (!k) throw new Error('The expression ends too early');
      if (k.t === 'num') { p++; var nn = { t: 'num', v: k.v }; if (k.dec) nn.dec = k.dec; return nn; }
      if (k.t === 'var') { p++; return { t: 'var', v: k.v }; }
      if (k.t === 'fn') { p++; eat('('); var a = expr(); eat(')'); return { t: 'sqrt', a: a }; }
      if (k.t === '(') { p++; var e = expr(); eat(')'); return { t: 'paren', a: e }; }
      throw new Error('Unexpected “' + k.t + '”');
    }
    var tree = expr();
    if (p < toks.length) throw new Error('Unexpected “' + toks[p].t + '”');
    return strip(tree);
  }
  function strip(n) { // remove paren nodes
    if (!n) return n;
    if (n.t === 'paren') return strip(n.a);
    var m = { t: n.t }; if ('v' in n) m.v = n.v; if (n.dec) m.dec = n.dec;
    if (n.a) m.a = strip(n.a); if (n.b) m.b = strip(n.b);
    return m;
  }
  function evaluate(n, env) {
    switch (n.t) {
      case 'num': return n.v;
      case 'var': if (!(n.v in env)) return NaN; return env[n.v];
      case 'add': return evaluate(n.a, env) + evaluate(n.b, env);
      case 'sub': return evaluate(n.a, env) - evaluate(n.b, env);
      case 'mul': return evaluate(n.a, env) * evaluate(n.b, env);
      case 'div': return evaluate(n.a, env) / evaluate(n.b, env);
      case 'neg': return -evaluate(n.a, env);
      case 'pow': return Math.pow(evaluate(n.a, env), evaluate(n.b, env));
      case 'sqrt': var v = evaluate(n.a, env); return v < 0 ? NaN : Math.sqrt(v);
    }
    return NaN;
  }
  function varsIn(n, set) {
    set = set || {};
    if (!n) return set;
    if (n.t === 'var') set[n.v] = true;
    varsIn(n.a, set); varsIn(n.b, set);
    return set;
  }
  function hasAddSub(n) { if (!n) return false; if (n.t === 'add' || n.t === 'sub') return true; if (n.t === 'sqrt') return false; return hasAddSub(n.a) || hasAddSub(n.b); }

  // pretty printer (unicode) for the "we read this as" preview
  var PREC = { add: 1, sub: 1, mul: 2, div: 2, neg: 3, pow: 4, num: 5, var: 5, sqrt: 5 };
  var SUPS = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
  function fmtN(v) { var s = (Math.round(v * 1e9) / 1e9).toString(); return s.replace('-', '−'); }
  function pretty(n) {
    function wrap(c, minP) { var s = pretty(c); return PREC[c.t] < minP ? '(' + s + ')' : s; }
    switch (n.t) {
      case 'num': return fmtN(n.v);
      case 'var': return n.v;
      case 'add': return pretty(n.a) + ' + ' + wrap(n.b, 2);
      case 'sub': return pretty(n.a) + ' − ' + wrap(n.b, 2);
      case 'mul':
        var L = wrap(n.a, 2), R = wrap(n.b, 3);
        var juxt = (n.b.t === 'var' || n.b.t === 'sqrt' || (n.b.t === 'pow' && n.b.a.t === 'var') || R[0] === '(') && n.a.t !== 'div';
        return juxt ? L + R : L + '·' + R;
      case 'div': return wrap(n.a, 2) + '/' + wrap(n.b, 3);
      case 'neg': return '−' + wrap(n.a, 3);
      case 'pow':
        var base = n.a.t === 'num' && n.a.v < 0 ? '(' + pretty(n.a) + ')' : wrap(n.a, 5);
        if (n.b.t === 'num' && Number.isInteger(n.b.v) && n.b.v >= 0) return base + String(n.b.v).split('').map(function (d) { return SUPS[d]; }).join('');
        if (n.b.t === 'neg' && n.b.a.t === 'num' && Number.isInteger(n.b.a.v)) return base + '⁻' + String(n.b.a.v).split('').map(function (d) { return SUPS[d]; }).join('');
        return base + '^(' + pretty(n.b) + ')';
      case 'sqrt': var a = pretty(n.a); return (n.a.t === 'num' || n.a.t === 'var') ? '√' + a : '√(' + a + ')';
    }
    return '?';
  }

  // ---------- equivalence ----------
  var SAMPLES = [-2.31, -1.17, 0.73, 1.91, 2.63, 3.37, -0.41, 4.19, 0.29, -3.07];
  function equivExpr(A, B, vars) {
    var good = 0;
    for (var i = 0; i < SAMPLES.length; i++) {
      var env = {};
      for (var j = 0; j < vars.length; j++) env[vars[j]] = SAMPLES[(i + 3 * j) % SAMPLES.length] + 0.13 * j;
      var a = evaluate(A, env), b = evaluate(B, env);
      if (!isFinite(a) || !isFinite(b)) { if (isFinite(a) !== isFinite(b)) return false; continue; }
      if (!approxEq(a, b)) return false;
      good++;
    }
    return good >= 4;
  }

  // ---------- form checks ----------
  function flattenMul(n, out) {
    out = out || [];
    if (n.t === 'mul') { flattenMul(n.a, out); flattenMul(n.b, out); }
    else if (n.t === 'neg') { flattenMul(n.a, out); }
    else out.push(n);
    return out;
  }
  function flattenAdd(n, out) {
    out = out || [];
    if (n.t === 'add' || n.t === 'sub') { flattenAdd(n.a, out); flattenAdd(n.b, out); } else out.push(n);
    return out;
  }
  function isExpanded(n) {
    if (!n) return true;
    if (n.t === 'mul' && (hasAddSub(n.a) || hasAddSub(n.b))) return false;
    if (n.t === 'pow' && hasAddSub(n.a)) return false;
    if (n.t === 'neg' && hasAddSub(n.a)) return false;
    return isExpanded(n.a) && isExpanded(n.b);
  }
  function factoredCount(n) {
    var fs = flattenMul(n), c = 0;
    for (var i = 0; i < fs.length; i++) {
      var f = fs[i]; if (!Object.keys(varsIn(f)).length) continue;
      if (f.t === 'pow' && f.b.t === 'num' && Number.isInteger(f.b.v) && f.b.v >= 2 && hasAddSub(f.a)) c += f.b.v;
      else c += 1;
    }
    return c;
  }
  function isMonomialForm(n) {
    if (n.t === 'div') return false;
    var fs = flattenMul(n), seen = {}, nums = 0;
    for (var i = 0; i < fs.length; i++) {
      var f = fs[i];
      if (f.t === 'num') { nums++; continue; }
      var v = null;
      if (f.t === 'var') v = f.v;
      else if (f.t === 'pow' && f.a.t === 'var' && f.b.t === 'num') v = f.a.v;
      else return false;
      if (seen[v]) return false; seen[v] = true;
    }
    return nums <= 1;
  }
  function radicalsSimplified(n) {
    if (!n) return true;
    if (n.t === 'sqrt') {
      if (Object.keys(varsIn(n.a)).length) return false;
      var v = evaluate(n.a, {});
      if (!Number.isInteger(v) || !isSquarefree(v)) return false;
    }
    if (n.t === 'div' && containsSqrt(n.b)) return false;
    if (n.t === 'pow' && n.b.t !== 'num') return false; // no fractional exponents left
    return radicalsSimplified(n.a) && radicalsSimplified(n.b);
  }
  function containsSqrt(n) { if (!n) return false; if (n.t === 'sqrt') return true; return containsSqrt(n.a) || containsSqrt(n.b); }
  function isLowestFraction(n) {
    var m = n.t === 'neg' ? n.a : n;
    if (m.t === 'num') return Number.isInteger(m.v);
    if (m.t === 'div' && m.a.t === 'num' && m.b.t === 'num' && Number.isInteger(m.a.v) && Number.isInteger(m.b.v)) return gcd(m.a.v, m.b.v) === 1 && m.b.v !== 1;
    return false;
  }
  // v2: a bare decimal (e.g. 8.485 for 6√2) on an exact-radical item. Notation, not a wrong idea.
  function isDecimalApprox(item, r) {
    if (item.form !== 'radical' || item.type !== 'number') return false;
    var m = r.ast.t === 'neg' ? r.ast.a : r.ast;
    if (m.t !== 'num' || !m.dec) return false;
    // accept the exact value rounded or truncated to the number of decimal places typed
    return Math.abs(r.value - item.key) <= Math.pow(10, -m.dec) + 1e-12;
  }

  // ---------- answer parsing by type ----------
  function stripLead(s, names) {
    s = normalize(s);
    for (var i = 0; i < names.length; i++) {
      var re = new RegExp('^\\s*' + names[i] + '\\s*=\\s*');
      if (re.test(s)) return s.replace(re, '');
    }

var BIG = {

function svgEl(w,h){ return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:340px;display:block;margin:8px auto">'; }
function vizF1(el){
  el.innerHTML = '<label class="note">number in front: <b id="av">3</b></label><input type="range" id="as" min="-5" max="6" step="1" value="3"><div id="pic"></div><p class="m" id="eq" style="text-align:center"></p>';
  function draw(){
    var a=+document.getElementById('as').value; if(a===0) a=1; document.getElementById('av').textContent=a;
    document.getElementById('pic').innerHTML=E.rectSVG(['x','−4'],[String(a)],[[ (a===1?'':a===-1?'−':a)+'x', String(-4*a)]]);
    document.getElementById('eq').innerHTML=a+'(<i>x</i> − 4) = '+(a===1?'':a===-1?'−':a)+'<i>x</i> '+(-4*a<0?'−':'+')+' '+Math.abs(4*a)+(a<0?' &nbsp;(negative times negative: +)':'');
  }
  document.getElementById('as').oninput=draw; draw();
}
function vizF2(el){
  el.innerHTML = '<label class="note">a = <b id="av">3</b></label><input type="range" id="as" min="-6" max="6" step="1" value="3"><label class="note">b = <b id="bv">3</b></label><input type="range" id="bs" min="-6" max="6" step="1" value="3"><div id="pic"></div><p class="m" id="eq" style="text-align:center"></p>';
  function t(v){ return (v<0?'−':'+')+Math.abs(v); }
  function m(v){ return (v===1?'':v===-1?'−':v)+'x'; }
  function draw(){
    var a=+document.getElementById('as').value||1, b=+document.getElementById('bs').value||1;
    document.getElementById('av').textContent=a; document.getElementById('bv').textContent=b;
    document.getElementById('pic').innerHTML=E.rectSVG(['x',t(b)],['x',t(a)],[['x²',m(b)],[m(a),String(a*b)]]);
    var mid=a+b;
    document.getElementById('eq').innerHTML='(<i>x</i> '+t(a).replace(/([+−])/,'$1 ')+')(<i>x</i> '+t(b).replace(/([+−])/,'$1 ')+') = <i>x</i><sup>2</sup>'+(mid===0?'':' '+(mid<0?'−':'+')+' '+(Math.abs(mid)===1?'':Math.abs(mid))+'<i>x</i>')+' '+(a*b<0?'−':'+')+' '+Math.abs(a*b)+(a===b?' &nbsp;(two equal middle pieces)':'');
  }
  document.getElementById('as').oninput=draw; document.getElementById('bs').oninput=draw; draw();
}

// ---------------- worked example ----------------
function worked(st){
  if(!st.seed){ st.seed=newSeed(); save(); }
  var it=E.generate(st.tid, st.seed), shown=1;
  function draw(){
    app.innerHTML = header('Worked example') + '<div class="card"><div class="prompt">'+it.prompt+'</div><ol class="steps">'+
      it.steps.slice(0,shown).map(function(s){ return '<li>'+s.m+(s.why?'<span class="why">'+s.why+'</span>':'')+'</li>'; }).join('')+'</ol>'+
      (shown<it.steps.length ? '<div class="row"><button class="btn" id="more">Next step</button></div>' : '<p><b>Answer:</b> '+it.keyHTML+'</p><div class="row"><button class="btn" id="nx">Now you finish one</button></div>')+'</div>';
    var m=document.getElementById('more'); if(m) m.onclick=function(){ shown++; draw(); };
    var n=document.getElementById('nx'); if(n) n.onclick=next;
  }
  draw();
}
function sentence(st){
  app.innerHTML = header('Last thing') + '<div class="card"><p class="big">In one sentence, in your own words: what is the big idea of <b>'+esc(CNAME[st.c])+'</b>?</p>'+
    '<textarea id="sent" style="height:90px;font:1rem system-ui" aria-label="Your sentence"></textarea><p class="note">Not graded. Saying it yourself is what makes it stick.</p><div class="row"><button class="btn" id="nx">Finish session</button></div></div>';
  document.getElementById('nx').onclick=function(){ S.current.sentence=document.getElementById('sent').value; next(); };
}

// ---------------- finish, progress, export ----------------
function finishSession(){
  var C=S.current; C.finished=new Date().toISOString();
  S.missedLast = C.items.filter(function(r){ return r.verdict!=='correct'; }).map(function(r){ return { template_id: r.template_id, concept: r.concept, sure: r.confidence==='sure' }; });
  S.sessions.push(C); S.current=null; save();
  summary(S.sessions.length-1);
}
function stats(items){
  var g=items.filter(function(r){ return r.graded; }), c=g.filter(function(r){ return r.verdict==='correct'; }).length;
  var sure=g.filter(function(r){ return r.confidence==='sure'; }), sr=sure.filter(function(r){ return r.verdict==='correct'; }).length;
  var asks=g.filter(function(r){ return 'asks_correct' in r; }), ac=asks.filter(function(r){ return r.asks_correct; }).length;
  return { n:g.length, correct:c, acc: g.length? c/g.length : null, sure:sure.length, sureRight: sr, sureAcc: sure.length? sr/sure.length : null, asks: asks.length, asksRight: ac };
}
function pct(v){ return v==null ? '–' : Math.round(100*v)+'%'; }
function progressTable(){
  if(!S.sessions.length) return '<p class="note">No finished sessions yet.</p>';
  var rows = S.sessions.map(function(s){
    var cells = ['F0','F1','F2'].map(function(c){ var st=stats(s.items.filter(function(r){ return r.concept===c; })); return '<td>'+(st.n? pct(st.acc)+' <span class="note">('+st.correct+'/'+st.n+')</span>' : '–')+'</td>'; }).join('');
    var all=stats(s.items);
    return '<tr><td>'+(s.lesson===3?'Review':'Lesson '+s.lesson)+'<br><span class="note">'+(new Date(s.started)).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})+'</span></td>'+cells+'<td>'+pct(all.sureAcc)+'</td></tr>';
  }).join('');
  return '<div style="overflow-x:auto"><table class="prog"><tr><th>Session</th><th>Signed numbers</th><th>Like terms, distributing</th><th>Multiplying binomials</th><th>Right when sure</th></tr>'+rows+'</table></div>';
}
function payload(i){
  var s=S.sessions[i];
  return { app: APP_FILE, version: VERSION, engine_version: E.version, learner: 'Charlie', session: s.id, lesson: s.lesson, focus_concept: s.focus,
    started: s.started, finished: s.finished, device: s.device, standalone: s.standalone, resumes: s.resumes, adaptive_rule: RULE,
    totals: stats(s.items), concept_state_after: S.cs, big_idea_sentence: s.sentence, items: s.items,
    history: S.sessions.map(function(x){ return { session:x.id, lesson:x.lesson, started:x.started, focus:x.focus, totals:stats(x.items),
      by_concept: ['F0','F1','F2'].reduce(function(o,c){ o[c]=stats(x.items.filter(function(r){ return r.concept===c; })); return o; },{}) }; }) };
}
function fname(i){ var d=new Date(S.sessions[i].finished||Date.now()); function p(n){return (n<10?'0':'')+n;} return 'alg2-tutor-15-results-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.json'; }
function summary(i){
  var s=S.sessions[i], st=stats(s.items);
  var missed=s.items.filter(function(r){ return r.verdict!=='correct'; });
  app.innerHTML='<h1>Session done.</h1><p>'+st.correct+' of '+st.n+' right'+(st.sure? '; right on '+st.sureRight+' of the '+st.sure+' you were sure about':'')+'.</p>'+
    '<div class="card"><b>Send it</b><p class="note">Download the results file and send it to your dad. It’s what the next session gets built from.</p><div class="row"><button class="btn" id="dl">Download results</button><button class="btn ghost" id="cp">Copy results</button></div><div id="cpbox"></div></div>'+
    (missed.length? '<div class="card"><b>Coming back next time</b><p class="note">These come back in your next warm-up, the ones you were sure about first:</p><ul class="tight">'+missed.map(function(r){ return '<li>'+esc(CNAME[r.concept])+': '+esc(r.trap_label||r.form_issue||(r.verdict==='skipped'?'skipped':'missed'))+'</li>'; }).join('')+'</ul></div>' : '')+
    '<h2>Your progress</h2><div class="card">'+progressTable()+'</div><div class="row"><button class="link" id="home">Back to start</button></div>';
  document.getElementById('dl').onclick=function(){
    try{ var P=payload(i), blob=new Blob([JSON.stringify(P,null,2)],{type:'application/json'}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname(i); document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500); }catch(e){ showCopy(); }
  };
  document.getElementById('cp').onclick=function(){
    var t=JSON.stringify(payload(i));
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){ document.getElementById('cpbox').innerHTML='<p class="note">Copied. Paste it into a message to your dad.</p>'; }, showCopy); } else showCopy();
  };
  function showCopy(){ var b=document.getElementById('cpbox'); b.innerHTML='<p class="note">Select all of this, copy it, and paste it into a message:</p><textarea readonly>'+esc(JSON.stringify(payload(i)))+'</textarea>'; b.querySelector('textarea').select(); }
  document.getElementById('home').onclick=home;
  window.scrollTo(0,0);
}

// ---------------- home ----------------
function home(){
  var C=S.current, n=lessonNo(), L=LESSONS[n], last=S.sessions[S.sessions.length-1];
  var gap='';
  if(n===2 && last && last.finished){ var mins=Math.round((Date.now()-new Date(last.finished).getTime())/60000); gap = mins < 90 ? '<p class="note">Lesson 1 finished '+mins+' minutes ago. Lesson 2 works best after a 90-minute break: the warm-up checks what stuck, and that only means something after a gap.</p>' : '<p class="note">Lesson 1 finished '+(mins<180?mins+' minutes':Math.round(mins/60)+' hours')+' ago. Good gap: go.</p>'; }
  app.innerHTML='<h1>Algebra foundations</h1><p>Short lessons on the moves everything in Algebra 2 is built on. About 20 minutes each: a warm-up, the big idea, an example, then problems on your own.</p>'+
    '<div class="card"><ul class="tight"><li>No hints until you answer.</li><li>After each answer, tap how sure you are.</li><li>Scratch paper out. Write every step.</li><li>Close it any time; it picks up where you left off on this device.</li></ul></div>'+
    '<div class="row">'+(C ? '<button class="btn" id="resume">Resume '+esc(LESSONS[C.lesson].title.split(':')[0])+' ('+(C.idx+1)+' of '+(C.steps.length-1)+')</button>' : '<button class="btn" id="start">Start '+esc(L.title)+'</button>')+'</div>'+gap+
    '<h2>Your progress</h2><div class="card">'+progressTable()+'</div>'+
    (S.sessions.length ? '<div class="row"><button class="link" id="last">Last session’s results and download</button></div>' : '')+
    '<details><summary>Typing math</summary><ul class="tight"><li>Exponent: <span class="kbd">x^2</span> or the x² button</li><li>Example: <span class="kbd">3x^2 - 5x + 2</span></li><li>Negative numbers: <span class="kbd">-12</span></li><li>Check “Reads as” under the box before you submit.</li></ul></details>';
  var r=document.getElementById('resume'); if(r) r.onclick=function(){ S.current.resumes++; save(); run(); };
  var s=document.getElementById('start'); if(s) s.onclick=function(){ startSession(n); };
  var l=document.getElementById('last'); if(l) l.onclick=function(){ summary(S.sessions.length-1); };
  window.scrollTo(0,0);
}

S = load(); if(!S || S.version!==VERSION) S = fresh();
window.APP15 = { current: function(){ return cur; }, state: function(){ return S; } };
home();
})();
</script>
